<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Stage D evaluation health rates</title>
  <desc id="desc">Grouped bars compare candidate and baseline exact-contract horizon completion rates in three comparisons.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#172033; --muted:#5f6b7a; --grid:#d8dee8; --blue:#2563eb; --orange:#ea580c; --green:#15803d; --red:#b91c1c; --purple:#7c3aed; --soft:#f3f6fa; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#f1f5f9; --muted:#b7c0cf; --grid:#3a475c; --blue:#60a5fa; --orange:#fb923c; --green:#4ade80; --red:#f87171; --purple:#c4b5fd; --soft:#172033; } }
    .bg{fill:var(--bg)} .fg{fill:var(--fg)} .muted{fill:var(--muted)} .soft{fill:var(--soft)}
    .grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--fg);stroke-width:1.25}
    .blue{fill:var(--blue);stroke:var(--blue)} .orange{fill:var(--orange);stroke:var(--orange)}
    .green{fill:var(--green);stroke:var(--green)} .red{fill:var(--red);stroke:var(--red)}
    .purple{fill:var(--purple);stroke:var(--purple)}
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--fg)}
    .title{font-size:26px;font-weight:600} .subtitle{font-size:15px;fill:var(--muted)}
    .label{font-size:14px} .small{font-size:12px;fill:var(--muted)} .value{font-size:14px;font-weight:600}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="500"/>
  <text class="title" x="48" y="48">Stage D evaluation health populations</text>
<text class="subtitle" x="48" y="75">Healthy means exact-contract horizon completion, not task success. Every model ran 64 rows.</text>
<rect x="100" y="120" width="1030" height="310" fill="none" class="grid"/>
<path class="grid" d="M 100 430.0 H 1130"/>
<text class="small" x="90" y="434.0" text-anchor="end">0%</text>
<path class="grid" d="M 100 352.5 H 1130"/>
<text class="small" x="90" y="356.5" text-anchor="end">25%</text>
<path class="grid" d="M 100 275.0 H 1130"/>
<text class="small" x="90" y="279.0" text-anchor="end">50%</text>
<path class="grid" d="M 100 197.5 H 1130"/>
<text class="small" x="90" y="201.5" text-anchor="end">75%</text>
<path class="grid" d="M 100 120.0 H 1130"/>
<text class="small" x="90" y="124.0" text-anchor="end">100%</text>
<rect class="blue" x="196.7" y="183.0" width="60" height="247.0" opacity="0.82"/>
<text class="value" x="226.7" y="175.0" text-anchor="middle">79.7%</text>
<rect class="orange" x="286.7" y="163.6" width="60" height="266.4" opacity="0.82"/>
<text class="value" x="316.7" y="155.6" text-anchor="middle">85.9%</text>
<text class="small" x="271.7" y="458" text-anchor="middle">v8 / source</text>
<rect class="blue" x="540.0" y="163.6" width="60" height="266.4" opacity="0.82"/>
<text class="value" x="570.0" y="155.6" text-anchor="middle">85.9%</text>
<rect class="orange" x="630.0" y="178.1" width="60" height="251.9" opacity="0.82"/>
<text class="value" x="660.0" y="170.1" text-anchor="middle">81.2%</text>
<text class="small" x="615.0" y="458" text-anchor="middle">v9 / v8</text>
<rect class="blue" x="883.3" y="173.3" width="60" height="256.7" opacity="0.82"/>
<text class="value" x="913.3" y="165.3" text-anchor="middle">82.8%</text>
<rect class="orange" x="973.3" y="207.2" width="60" height="222.8" opacity="0.82"/>
<text class="value" x="1003.3" y="199.2" text-anchor="middle">71.9%</text>
<text class="small" x="958.3" y="458" text-anchor="middle">v10-3270 / v9</text>
<rect class="blue" x="792" y="62" width="14" height="14"/><text class="small" x="814" y="74">Candidate</text>
<rect class="orange" x="908" y="62" width="14" height="14"/><text class="small" x="930" y="74">Baseline</text>
</svg>
