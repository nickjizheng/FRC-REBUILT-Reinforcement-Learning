  <title id="title">Stage A learning telemetry</title>
  <desc id="desc">Line chart of recent return and collection reward across approximately 106 thousand transitions.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#172033; --muted:#5f6b7a; --grid:#d8dee8; --blue:#2563eb; --orange:#ea580c; --green:#15803d; --red:#b91c1c; --purple:#7c3aed; --soft:#f3f6fa; }
