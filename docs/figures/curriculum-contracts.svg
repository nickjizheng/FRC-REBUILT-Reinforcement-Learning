<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Stage A-D reinforcement-learning curriculum</title>
  <desc id="desc">Four progressively harder curriculum stages, from twenty-second collection tasks with thirty-two FUEL to exact one-hundred-sixty-second matches with all four-hundred-fifty-six FUEL.</desc>
  <style>
    :root {
      --bg:#ffffff; --card:#f8fafc; --fg:#172033; --muted:#5f6b7a;
      --border:#dbe2ea; --connector:#9aa7b8; --on-accent:#ffffff;
      --a:#2563eb; --a-soft:#e8f0ff; --b:#e25518; --b-soft:#fff0e8;
      --c:#16803f; --c-soft:#e6f6ec; --d:#7540dc; --d-soft:#f0eafe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f172a; --card:#172033; --fg:#f1f5f9; --muted:#b7c0cf;
        --border:#344157; --connector:#7d899a; --on-accent:#ffffff;
        --a:#60a5fa; --a-soft:#172b50; --b:#fb923c; --b-soft:#442716;
        --c:#4ade80; --c-soft:#173b29; --d:#c4b5fd; --d-soft:#302650;
      }
    }
    text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:var(--fg)}
    .bg{fill:var(--bg)} .card{fill:var(--card);stroke:var(--border);stroke-width:1}
    .title{font-size:28px;font-weight:650;letter-spacing:-.25px}
    .subtitle{font-size:15px;fill:var(--muted)}
    .stage-kicker{font-size:11px;font-weight:700;letter-spacing:1.25px}
    .stage-name{font-size:18px;font-weight:650}
    .contract{font-size:17px;font-weight:700;letter-spacing:-.1px}
    .section-label{font-size:11px;font-weight:700;letter-spacing:1px;fill:var(--muted)}
    .goal{font-size:14px}
    .evidence{font-size:12.5px;font-weight:600}
    .letter{font-size:16px;font-weight:700;fill:var(--on-accent)}
    .connector{fill:none;stroke:var(--connector);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .a-fill{fill:var(--a)} .a-text{fill:var(--a)} .a-soft{fill:var(--a-soft)}
    .b-fill{fill:var(--b)} .b-text{fill:var(--b)} .b-soft{fill:var(--b-soft)}
    .c-fill{fill:var(--c)} .c-text{fill:var(--c)} .c-soft{fill:var(--c-soft)}
    .d-fill{fill:var(--d)} .d-text{fill:var(--d)} .d-soft{fill:var(--d-soft)}
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="390"/>
  <text class="title" x="42" y="47">Four-stage curriculum: from collection to full matches</text>
  <text class="subtitle" x="42" y="75">Each stage has a frozen contract; compare scores within a stage, not across stages.</text>

  <path class="connector" d="M304 229h18m-6-6 6 6-6 6"/>
  <path class="connector" d="M590 229h18m-6-6 6 6-6 6"/>
  <path class="connector" d="M876 229h18m-6-6 6 6-6 6"/>

  <g aria-label="Stage A: collection foundations">
    <rect class="card" x="42" y="105" width="262" height="242" rx="14"/>
    <path class="a-fill" d="M56 105h234a14 14 0 0 1 14 14v0H42v0a14 14 0 0 1 14-14z"/>
    <circle class="a-fill" cx="74" cy="148" r="19"/>
    <text class="letter" x="74" y="154" text-anchor="middle">A</text>
    <text class="stage-kicker a-text" x="104" y="143">STAGE A</text>
    <text class="stage-name" x="104" y="164">Collection foundations</text>
    <rect class="a-soft" x="62" y="186" width="222" height="40" rx="12"/>
    <text class="contract a-text" x="78" y="212">20 s · 32 FUEL</text>
    <text class="section-label" x="62" y="251">LEARNING GOAL</text>
    <text class="goal" x="62" y="276">Acquire FUEL from camera</text>
    <text class="goal" x="62" y="297">observations</text>
    <circle class="a-fill" cx="68" cy="325" r="4"/>
    <text class="evidence" x="80" y="329">Fixed diagnostic</text>
  </g>

  <g aria-label="Stage B: vectorized transition">
    <rect class="card" x="328" y="105" width="262" height="242" rx="14"/>
    <path class="b-fill" d="M342 105h234a14 14 0 0 1 14 14v0H328v0a14 14 0 0 1 14-14z"/>
    <circle class="b-fill" cx="360" cy="148" r="19"/>
    <text class="letter" x="360" y="154" text-anchor="middle">B</text>
    <text class="stage-kicker b-text" x="390" y="143">STAGE B</text>
    <text class="stage-name" x="390" y="164">Vectorized transition</text>
    <rect class="b-soft" x="348" y="186" width="222" height="40" rx="12"/>
    <text class="contract b-text" x="364" y="212">36 s · 96 FUEL</text>
    <text class="section-label" x="348" y="251">LEARNING GOAL</text>
    <text class="goal" x="348" y="276">Acquire and score from</text>
    <text class="goal" x="348" y="297">mixed starts</text>
    <circle class="b-fill" cx="354" cy="325" r="4"/>
    <text class="evidence" x="366" y="329">Training smoke</text>
  </g>

  <g aria-label="Stage C: deterministic autonomy">
    <rect class="card" x="614" y="105" width="262" height="242" rx="14"/>
    <path class="c-fill" d="M628 105h234a14 14 0 0 1 14 14v0H614v0a14 14 0 0 1 14-14z"/>
    <circle class="c-fill" cx="646" cy="148" r="19"/>
    <text class="letter" x="646" y="154" text-anchor="middle">C</text>
    <text class="stage-kicker c-text" x="676" y="143">STAGE C</text>
    <text class="stage-name" x="676" y="164">Deterministic autonomy</text>
    <rect class="c-soft" x="634" y="186" width="222" height="40" rx="12"/>
    <text class="contract c-text" x="648" y="212">90 / 120 s · 200 FUEL</text>
    <text class="section-label" x="634" y="251">LEARNING GOAL</text>
    <text class="goal" x="634" y="276">Repeat collection, return,</text>
    <text class="goal" x="634" y="297">and scoring cycles</text>
    <circle class="c-fill" cx="640" cy="325" r="4"/>
    <text class="evidence" x="652" y="329">Fixed diagnostic</text>
  </g>

  <g aria-label="Stage D: full-match retention">
    <rect class="card" x="900" y="105" width="258" height="242" rx="14"/>
    <path class="d-fill" d="M914 105h230a14 14 0 0 1 14 14v0H900v0a14 14 0 0 1 14-14z"/>
    <circle class="d-fill" cx="932" cy="148" r="19"/>
    <text class="letter" x="932" y="154" text-anchor="middle">D</text>
    <text class="stage-kicker d-text" x="962" y="143">STAGE D</text>
    <text class="stage-name" x="962" y="164">Full-match retention</text>
    <rect class="d-soft" x="920" y="186" width="218" height="40" rx="12"/>
    <text class="contract d-text" x="936" y="212">160 s · 456 FUEL</text>
    <text class="section-label" x="920" y="251">LEARNING GOAL</text>
    <text class="goal" x="920" y="276">Execute exact full-match</text>
    <text class="goal" x="920" y="297">behavior</text>
    <circle class="d-fill" cx="926" cy="325" r="4"/>
    <text class="evidence" x="938" y="329">Fixed paired evaluation</text>
  </g>
</svg>
